command: ["python", "app.py"]
# SQL and Genie both use the signed-in user's token, not the app service principal.
# user_api_scopes must include sql and genie. See README.
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse        # resource key you add under the app's Resources
  - name: CATALOG
    value: "payroll_demo"
  - name: SCHEMA
    value: "reporting"
  # Uncomment after the Genie agent is attached to this app with resource key genie-space
  # and permission Can run. Deploy fails if this line is active and the resource is missing.
  - name: GENIE_SPACE_ID
    valueFrom: genie-space
